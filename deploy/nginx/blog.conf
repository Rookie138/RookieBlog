# BlogSystem nginx 配置（HTTP 版，供 certbot --nginx 升级为 HTTPS）
# 本项目实际域名结构：
#   前台   https://amoblog.265483.xyz
#   管理端 https://admin.amoblog.265483.xyz
#   （根域 265483.xyz 与 www 当前没有 A 记录，不要照 @ 去配）
# 放置：/etc/nginx/sites-available/blog.conf
# 注意：/auth /manage-articles /common-articles /comments 反代到本机后端；两个前端均为纯静态 + SPA fallback

# ---------- 博客前台：https://amoblog.265483.xyz ----------
server {
    listen 80;
    listen [::]:80;
    server_name amoblog.265483.xyz;

    root /opt/blog/frontend-dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 20m;

    # 公开文章接口 → 后端
    location /common-articles {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 前台评论接口（浏览评论树 + 游客发表评论）→ 后端
    # 注意：/comments/manage/... 也会命中这里，但它需要 Bearer token，前台域名下调用会被后端 401 拒绝；
    #       真正要删评论请用管理端域名。
    location /comments {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}

# ---------- 管理端：https://admin.amoblog.265483.xyz ----------
server {
    listen 80;
    listen [::]:80;
    server_name admin.amoblog.265483.xyz;

    root /opt/blog/manage-dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 20m;

    # 登录 + 管理接口 + 评论管理 → 后端（鉴权 Bearer token 原样透传）
    location ~ ^/(auth|manage-articles|comments) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA history 路由回退（/login /articles/new 等直接打开不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
